name: Setup
description: Setup and install dependencies

outputs:
    actions-cache-url:
        description: GitHub Actions cache URL
        value: ${{ steps.export-env.outputs.actions-cache-url }}
    actions-results-url:
        description: GitHub Actions results URL
        value: ${{ steps.export-env.outputs.actions-results-url }}
    actions-runtime-token:
        description: GitHub Actions runtime token
        value: ${{ steps.export-env.outputs.actions-runtime-token }}
    actions-cache-service-v2:
        description: GitHub Actions cache service v2
        value: ${{ steps.export-env.outputs.actions-cache-service-v2 }}

runs:
    using: composite
    steps:
        - name: Set Rust environment variables
          shell: bash
          run: |
              echo "CARGO_INCREMENTAL=0" >> $GITHUB_ENV
              echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
              echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

        - name: Install Rust and tools
          uses: taiki-e/install-action@v2
          with:
              tool: |
                  rust@nightly+rustfmt+clippy
                  sccache
                  nextest
                  cargo-mutants
                  cargo-llvm-cov

        - name: Cache crates
          uses: Swatinem/rust-cache@v2
          with:
              cache-targets: false
              cache-on-failure: true

        - name: Export GitHub Actions env variables
          id: export-env
          uses: actions/github-script@v9
          with:
              script: |
                  const outputs = {};
                  for (const key of [
                      'ACTIONS_CACHE_URL',
                      'ACTIONS_RESULTS_URL',
                      'ACTIONS_RUNTIME_TOKEN',
                      'ACTIONS_CACHE_SERVICE_V2',
                  ]) {
                      if (process.env[key]) {
                          core.exportVariable(key, process.env[key]);
                          outputs[key.toLowerCase()] = process.env[key];
                      }
                  }
                  Object.entries(outputs).forEach(([key, value]) => {
                      core.setOutput(key, value);
                  });

    post:
        - name: Print sccache stats
          if: always()
          shell: bash
          run: |
              {
              echo "### sccache Stats"
              echo '```text'
              sccache --show-stats
              echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
