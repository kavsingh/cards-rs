name: Test and lint

on:
    push:
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup
            - run: cargo xtask lint
              env: { RUSTFLAGS: "-Dwarnings" }

    test:
        name: Test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup
            - run: cargo xtask test

    mutation-test:
        name: Mutation test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup
            - run: cargo xtask mutants
