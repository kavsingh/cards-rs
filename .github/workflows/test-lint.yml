name: Test and lint

on:
    push:
    workflow_dispatch:
    workflow_call:

jobs:
    test-lint:
        name: Test and lint
        runs-on: ubuntu-latest
        env:
            RUSTFLAGS: "-Dwarnings"
        steps:
            - uses: actions/checkout@v6
            - uses: taiki-e/install-action@v2
              with:
                  tool: |
                      rust+clippy
                      nextest
                      cargo-mutants
            - run: cargo mutants --in-place --test-tool=nextest
            - run: cargo clippy --all-targets --all-features -- -Dwarnings -Dclippy::all
