name: Test and lint

on:
    push:
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read

env:
    CARGO_INCREMENTAL: "0"
    RUSTC_WRAPPER: sccache
    SCCACHE_GHA_ENABLED: "true"

jobs:
    test-lint:
        name: Test and lint
        runs-on: ubuntu-latest

        steps:
            - name: checkout
              uses: actions/checkout@v7

            - name: install rust and tools
              uses: taiki-e/install-action@v2
              with:
                  tool: |
                      rust@nightly+rustfmt+clippy
                      sccache
                      nextest
                      cargo-mutants
                      cargo-llvm-cov

            - name: export github actions env variables
              uses: actions/github-script@v9
              with:
                  script: |
                      for (const key of [
                          'ACTIONS_CACHE_URL',
                          'ACTIONS_RESULTS_URL',
                          'ACTIONS_RUNTIME_TOKEN',
                          'ACTIONS_CACHE_SERVICE_V2',
                      ]) {
                          if (process.env[key]) {
                              core.exportVariable(key, process.env[key]);
                          }
                      }

            - name: lint
              env: { RUSTFLAGS: "-Dwarnings" }
              run: cargo xtask lint

            - name: test
              run: cargo xtask test

            - name: mutation test
              run: cargo xtask mutants

            - name: print cache stats
              if: always()
              run: |
                  {
                  echo "### sccache Stats"
                  echo '```text'
                  sccache --show-stats
                  echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
