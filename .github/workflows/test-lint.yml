name: Test and lint

on:
    push:
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read

env:
    RUSTFLAGS: "-Dwarnings"
    RUSTC_WRAPPER: sccache
    SCCACHE_GHA_ENABLED: "true"

jobs:
    test-lint:
        name: Test and lint
        runs-on: ubuntu-latest

        steps:
            - name: checkout
              uses: actions/checkout@v7

            - name: install rust and tools
              uses: taiki-e/install-action@v2
              with:
                  tool: |
                      rust@nightly+rustfmt+clippy
                      sccache
                      nextest
                      cargo-mutants
                      cargo-llvm-cov

            - name: export github actions env variables
              uses: actions/github-script@v9
              with:
                  script: |
                      core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
                      core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

            - name: lint
              run: cargo xtask lint

            - name: test
              run: cargo xtask test

            - name: mutation test
              run: cargo xtask mutants

            - name: print cache stats
              if: always()
              run: |
                  {
                  echo "### sccache Stats"
                  echo '```text'
                  sccache --show-stats
                  echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
