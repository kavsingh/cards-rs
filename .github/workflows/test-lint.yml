name: Test and lint

on:
    push:
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup
              uses: ./.github/actions/setup

            - name: Lint
              run: cargo xtask lint
              env: { RUSTFLAGS: "-Dwarnings" }

            - name: Summary
              if: always()
              uses: ./.github/actions/summary

    test:
        name: Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup
              uses: ./.github/actions/setup

            - name: Test
              run: cargo xtask test

            - name: Summary
              if: always()
              uses: ./.github/actions/summary

    mutation-test:
        name: Mutation test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup
              uses: ./.github/actions/setup

            - name: Mutation test
              run: cargo xtask mutants

            - name: Summary
              if: always()
              uses: ./.github/actions/summary
