name: Test and lint

on:
    push:
    workflow_dispatch:
    workflow_call:

jobs:
    test-lint:
        name: Test and lint
        runs-on: ubuntu-latest
        env:
            RUSTFLAGS: "-Dwarnings"
        steps:
            - uses: actions/checkout@v7
            - uses: taiki-e/install-action@v2
              with:
                  tool: |
                      rust@nightly+rustfmt+clippy
                      nextest
                      cargo-mutants
                      cargo-llvm-cov
            - run: cargo xtask lint
            - run: cargo xtask test
            - run: cargo xtask mutants
